<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0A0A0A"/>
  <!-- Purple ring -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#8B00FF" stroke-width="12"/>
  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#6600CC" stroke-width="4" opacity="0.6"/>

  <!-- CM letters -->
  <text x="256" y="200" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="120" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle"
    letter-spacing="-4">CM</text>

  <!-- "CRAZY MESS" text -->
  <text x="256" y="290" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="38" fill="#AA44FF" text-anchor="middle" dominant-baseline="middle"
    letter-spacing="8">CRAZY</text>
  <text x="256" y="338" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="38" fill="#AA44FF" text-anchor="middle" dominant-baseline="middle"
    letter-spacing="8">MESS</text>

  <!-- Decorative lines -->
  <line x1="80" y1="310" x2="170" y2="310" stroke="#8B00FF" stroke-width="2" opacity="0.6"/>
  <line x1="342" y1="310" x2="432" y2="310" stroke="#8B00FF" stroke-width="2" opacity="0.6"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B00FF"/>
      <stop offset="50%" style="stop-color:#AA44FF"/>
      <stop offset="100%" style="stop-color:#CC88FF"/>
    </linearGradient>
  </defs>
</svg>
